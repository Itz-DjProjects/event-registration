{% extends 'base.html' %}{% block content %}<h1>Register for {{ event.name }}</h1><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Student name<input name="student_name" maxlength="100" required value="{{ request.form.get('student_name','') }}"></label><label>Roll number<input name="roll_no" maxlength="40" required value="{{ request.form.get('roll_no','') }}"></label><button class="button">Confirm registration</button></form>{% endblock %}
