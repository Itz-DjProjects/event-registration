<form method="post" class="form narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Event name<input name="name" maxlength="120" required value="{{ request.form.get('name', current.name if current is defined else '') }}"></label><label>Event date<input type="date" name="event_date" required value="{{ request.form.get('event_date', current.event_date if current is defined else '') }}"></label><label>Seat capacity<input type="number" name="seats" min="1" required value="{{ request.form.get('seats', current.seats if current is defined else '') }}"></label><button class="button">Save event</button></form>
