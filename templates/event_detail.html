{% extends 'base.html' %}{% block content %}<a href="{{ url_for('student.events') }}">← All events</a><section class="panel"><p class="eyebrow">{{ event.event_date }}</p><h1>{{ event.name }}</h1><div class="stats"><div><b>{{ event.seats }}</b><span>Total seats</span></div><div><b>{{ event.registered }}</b><span>Registered</span></div><div><b>{{ event.available }}</b><span>Available</span></div></div>{% if event.available > 0 %}<a class="button" href="{{ url_for('student.register',event_id=event.event_id) }}">Register</a>{% else %}<p class="notice error">This event is full.</p>{% endif %}</section>{% endblock %}
