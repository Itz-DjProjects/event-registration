{% extends 'base.html' %}{% block content %}<h1>Event registration summary</h1><div class="table-wrap"><table><thead><tr><th>Event</th><th>Total capacity</th><th>Active registrations</th><th>Available seats</th><th>Registration</th></tr></thead><tbody>{% for e in rows %}<tr><td>{{ e.name }}</td><td>{{ e.seats }}</td><td>{{ e.active }}</td><td>{{ e.available }}</td><td>{{ e.percentage }}%</td></tr>{% else %}<tr><td colspan="5">No events to summarize.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
